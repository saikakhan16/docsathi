services:

  backend:
    build:
      context: ./backend
    container_name: docsathi-backend

    ports:
      - "5000:5000"

    environment:
      PORT: 5000
      JWT_SECRET: docsathi_secret_2024

    volumes:
      - ./backend:/app
      - /app/node_modules

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
    container_name: docsathi-frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

    restart: unless-stopped